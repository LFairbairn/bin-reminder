name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
    
        services:
            redis:
                image: redis
                ports: 
                    - 6379:6379
    
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
            - run: uv sync
            - run: uv run pytest